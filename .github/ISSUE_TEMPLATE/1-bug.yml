name: Bug report
description: Report a defect on the website — broken page, rendering issue, dead link, etc.
title: "[bug]: "
type: Bug
labels: ["status:triage"]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
      description: The specific page this is about.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & device
      description: e.g. Chrome 130 on macOS, Safari on iOS
