name: CI

on:
  push:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:

# Cancel a superseded run of THIS workflow on the same ref -- a new push to a
# PR branch, or a newer merge to main, cancels the older in-flight/queued run
# instead of piling a redundant one onto the org's constrained self-hosted pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Always GitHub-hosted. This repo is public, so hosted minutes are free, and
    # the Pages flow can't run on the org's self-hosted pool anyway: both
    # upload-pages-artifact (FinalizeArtifact -> ENOTFOUND) and the deploy job's
    # OIDC id-token fetch fail on those runners' egress. Hosted is reliable and
    # keeps external fork PRs off our infrastructure too. (Because push no longer
    # targets self-hosted, www needs no drain-public-ci gate flip to deploy.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    # Always GitHub-hosted: this job only runs actions/deploy-pages (no build,
    # no repo code executes), and that action's OIDC id-token fetch times out on
    # the self-hosted pool ("Failed to get ID Token"), which fails the whole
    # Pages deploy. GitHub-hosted has reliable OIDC and costs no self-hosted time.
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
